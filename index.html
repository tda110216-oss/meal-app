<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meal_minokyoro</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont;
    margin: 0;
    padding: 10px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
    font-size: 20px;
}

#datePicker {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 10px;
}

.header {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    margin-bottom: 10px;
}

.row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.col {
    width: 48%;
    text-align: center;
}

button {
    width: 48%;
    margin: 2px;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
}

.on {
    background: #4CAF50;
    color: white;
}

.off {
    background: #ddd;
}
</style>
</head>

<body>

<h1>meal_minokyoro</h1>
<input type="date" id="datePicker">
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 Firebase設定（必ず入力） */
const firebaseConfig = {
  apiKey: "AIzaSyD08AwiSk7AqPxh5id_oyfqJJ6m_PylGKc",
  authDomain: "meal-minokyoro.firebaseapp.com",
  projectId: "meal-minokyoro"
};

const appFirebase = initializeApp(firebaseConfig);
const db = getFirestore(appFirebase);

document.addEventListener("DOMContentLoaded", async () => {

const app = document.getElementById("app");
const datePicker = document.getElementById("datePicker");

let holidays = {};
let data = {};

/* ------------------ 祝日 ------------------ */
async function fetchHolidays(year) {
    try {
        const res = await fetch(`https://holidays-jp.github.io/api/v1/${year}/date.json`);
        holidays = await res.json();
    } catch (e) {
        console.log("holiday error", e);
        holidays = {};
    }
}

/* ------------------ Firebase ------------------ */
async function loadData() {
    try {
        const snap = await getDoc(doc(db, "meal", "shared"));
        if (snap.exists()) data = snap.data();
    } catch (e) {
        console.log("load error", e);
    }
}

async function saveData() {
    try {
        await setDoc(doc(db, "meal", "shared"), data);
    } catch (e) {
        console.log("save error", e);
    }
}

/* ------------------ トグル ------------------ */
window.toggle = function(key) {
    data[key] = !data[key];
    saveData();
    render();
};

/* ------------------ 初期値 ------------------ */
function get(key, type) {
    if (data[key] !== undefined) return data[key];
    return type === "tw" ? false : true;
}

/* ------------------ 日曜取得 ------------------ */
function getSunday(date) {
    const d = new Date(date);
    d.setDate(d.getDate() - d.getDay());
    return d;
}

/* ------------------ 描画 ------------------ */
async function render() {

    if (!datePicker.value) return;

    app.innerHTML = "";

    const baseDate = datePicker.value
        ? new Date(datePicker.value)
        : new Date();

    await fetchHolidays(baseDate.getFullYear());

    const sunday = getSunday(baseDate);

    for (let i = 0; i < 7; i++) {

        const d = new Date(sunday);
        d.setDate(sunday.getDate() + i);

        const dayStr = d.toISOString().split("T")[0];
        const weekday = d.toLocaleDateString("ja-JP", { weekday: "long" });

        const isHoliday = holidays[dayStr];
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
        <div class="header">
            <div>${weekday}</div>
            <div>${dayStr}</div>
        </div>

        <div class="row">
            <div class="col">
                <p>🍽 M</p>
                ${["lunch","dinner"].map(m =>
                    `<button class="${get(dayStr+"_M_"+m) ? "on":"off"}"
                    onclick="toggle('${dayStr}_M_${m}')">
                    ${m=="lunch"?"昼":"夜"}
                    </button>`).join("")}
            </div>

            <div class="col">
                <p>🍽 K</p>
                ${["lunch","dinner"].map(m =>
                    `<button class="${get(dayStr+"_K_"+m) ? "on":"off"}"
                    onclick="toggle('${dayStr}_K_${m}')">
                    ${m=="lunch"?"昼":"夜"}
                    </button>`).join("")}
            </div>
        </div>

        <div class="row">
            ${(!isWeekend && !isHoliday) ? `
            <div class="col">
                <p>💻 M</p>
                ${["am","pm"].map(t =>
                    `<button class="${get(dayStr+"_M_tw_"+t,"tw") ? "on":"off"}"
                    onclick="toggle('${dayStr}_M_tw_${t}')">
                    ${t=="am"?"午前":"午後"}
                    </button>`).join("")}
            </div>

            <div class="col">
                <p>💻 K</p>
                ${["am","pm"].map(t =>
                    `<button class="${get(dayStr+"_K_tw_"+t,"tw") ? "on":"off"}"
                    onclick="toggle('${dayStr}_K_tw_${t}')">
                    ${t=="am"?"午前":"午後"}
                    </button>`).join("")}
            </div>
            ` : `<p style="text-align:center;width:100%">休日</p>`}
        </div>
        `;

        app.appendChild(card);
    }
}

/* ------------------ 初期 ------------------ */
datePicker.value = new Date().toISOString().split("T")[0];

datePicker.addEventListener("change", async () => {
    await loadData();
    render();
});

await loadData();
render();

});
</script>

</body>
</html>
